services:
  postgres:
    image: postgres:17
    container_name: cache-guard-postgres
    environment:
      POSTGRES_DB: cacheguard
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - cache-guard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d cacheguard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cache-guard-postgres-data:
